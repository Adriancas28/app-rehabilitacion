<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--p:#12A79B;--bg:#F5F6F8;--t:#1F2937;--t2:#6B7280;--ok:#1E7A46;--am:#B26A00;--er:#E5484D}
*{box-sizing:border-box;margin:0;font-family:Roboto,Arial,sans-serif}
body{width:360px;height:780px;background:var(--bg);color:var(--t);overflow:hidden;position:relative}
.sb{height:24px;background:#0d8a80;color:#fff;font-size:11px;padding:4px 14px}
.bar{height:56px;background:var(--p);color:#fff;display:flex;align-items:center;padding:0 16px;font-weight:700;font-size:19px;gap:16px}
.bar span.r{margin-left:auto;font-weight:500;font-size:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:block;text-align:center;border-radius:999px;padding:13px;font-weight:700;font-size:15px;background:var(--p);color:#fff}
.btn.o{background:#fff;border:2px solid var(--er);color:var(--er)}
.cam{position:relative;background:linear-gradient(180deg,#3b4a52,#222d33);overflow:hidden}
.badge{position:absolute;top:10px;left:10px;background:#e3f4ea;color:var(--ok);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700}
.badge:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.ico{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:#B26A00;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.hud{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;border-radius:16px;padding:8px 16px;text-align:center;min-width:230px}
.hud .a{font-size:11px;opacity:.85;background:none;color:#fff}.hud .n{font-size:15px;font-weight:700}.hud .m{font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.sw{width:42px;height:24px;border-radius:12px;background:var(--p);position:relative}.sw:after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.lab{font-size:12px;color:var(--t2)}.val{font-size:14px;margin-bottom:10px;border:1px solid #d9dde3;border-radius:12px;padding:10px 12px}
h3{font-size:15px;margin-bottom:8px}
.pill{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.g{background:#e3f4ea;color:var(--ok)}.a{background:#fff1d6;color:var(--am)}
.mk{position:absolute;bottom:6px;right:8px;font-size:9px;color:#9ca3af}
</style></head><body>
<div class="sb">10:34</div>
<div id="app"></div>
<script>
const s=new URLSearchParams(location.search).get('s')||'1';
const fig=(extra)=>`<svg viewBox="0 0 360 520" width="360" height="520" style="position:absolute;inset:0">
<g stroke="#9fb0b8" stroke-width="10" stroke-linecap="round" fill="none"><circle cx="180" cy="120" r="26" fill="#9fb0b8"/><path d="M180 150 L180 300 M180 175 L130 250 M180 175 L238 230 M180 300 L150 440 M180 300 L212 440"/></g>${extra}</svg>`;
const guia=`<g fill="none">
<path d="M180 175 L238 230" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" opacity=".0"/>
<path d="M 180 175 m 0 100 A 100 100 0 0 1 280 175" stroke="#fff" stroke-width="3" stroke-dasharray="7 7" opacity=".9"/>
<path d="M180 175 L275 150 A100 100 0 0 1 280 175 Z" fill="#2ECC71" opacity=".3"/>
<path d="M 180 275 A100 100 0 0 1 252 197" stroke="#FFB020" stroke-width="7" stroke-linecap="round"/>
<path d="M180 175 L278 160" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/>
<circle cx="278" cy="160" r="9" stroke="#fff" stroke-width="3"/><circle cx="278" cy="160" r="4" fill="#2ECC71" stroke="none"/>
<path d="M180 175 L238 230" stroke="#FFB020" stroke-width="9" stroke-linecap="round"/>
<circle cx="180" cy="175" r="8" fill="#fff" stroke="none"/><circle cx="238" cy="230" r="7" fill="#FFB020" stroke="none"/></g>`;
const screens={
'1':`<div class="bar">Mini-sentadilla<span class="r">Salir</span></div>
<div class="cam" style="height:520px">${fig('')}<div class="badge">Cámara en vivo</div></div>
<div style="background:#fff;padding:12px 16px"><div class="lab" style="margin-bottom:6px">Colócate de frente a la cámara y sigue la guía.</div><div class="btn">▶ Iniciar sesión</div></div>`,
'2':`<div class="bar">Mini-sentadilla<span class="r">Salir</span></div>
<div class="cam" style="height:470px">${fig(guia)}<div class="badge">Cámara en vivo</div><div class="ico">!</div>
<div class="hud"><div class="a">Repetición 2/6 · Acción 1/2</div><div class="n">Subir el brazo</div><div class="m">Sigue: subir el brazo.</div></div></div>
<div style="background:#fff;padding:10px 16px;text-align:center"><div style="display:inline-block;width:72px;height:72px;border-radius:50%;border:6px solid var(--p);line-height:60px;font-weight:700;font-size:18px">5 s</div><div class="lab" style="margin:4px 0 8px">Monitoreando…</div><div class="btn o">■ Finalizar ejercicio</div></div>`,
'3':`<div class="bar">Perfil</div>
<div class="card"><h3>Datos de la cuenta</h3><div class="lab">Nombre</div><div class="val">Juan Pérez</div><div class="lab">Correo electrónico</div><div class="val" style="background:#f3f4f6">juan.perez@correo.com</div><div class="btn">Guardar cambios</div></div>
<div class="card"><h3>Información clínica</h3><div class="lab">DNI</div><div class="val" style="background:#f3f4f6">70123456</div><div class="lab">Diagnóstico(s)</div><div class="val" style="background:#f3f4f6">Osteoartritis de rodilla</div></div>
<div class="card" style="outline:2px dashed var(--p)"><h3>Guía durante el ejercicio</h3><div class="row"><span>Indicaciones por voz</span><div class="sw"></div></div><div class="row" style="border:0"><span>Vibración</span><div class="sw"></div></div></div>`,
'4':`<div class="bar">Resultado de la sesión</div>
<div class="card"><h3>Mini-sentadilla</h3><div class="lab">Promedio 78% · 5/6 repeticiones correctas</div></div>
<div class="card"><h3>Repetición 2/6 <span class="pill a" style="float:right">62% correcto</span></h3>
<div style="font-size:13px;color:var(--er);margin:6px 0">Segundo 7 — Subir el brazo — no se mantuvo la posición: llegó a 74° (meta 90°)</div>
<div style="font-size:13px;color:var(--t2)">Acción 1: incompleta — ángulo máximo 74°</div>
<div style="font-size:13px;color:var(--t2)">Acción 2: completada — ángulo máximo 20°</div></div>
<div class="card"><h3>Repetición 3/6 <span class="pill g" style="float:right">100% correcto</span></h3>
<div style="font-size:13px;color:var(--t2)">Acción 1: completada — ángulo máximo 91°</div><div style="font-size:13px;color:var(--t2)">Acción 2: completada — ángulo máximo 18°</div></div>`
};
document.getElementById('app').innerHTML=screens[s]+'<div class="mk">MOCKUP</div>';
</script></body></html>
